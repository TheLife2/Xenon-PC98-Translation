# DOSBox-X — XENON 디버깅 전용 설정
# 정상 플레이 캡처는 기존 np2 경로를 쓴다. 이건 트레이스/덤프용이다.
[sdl]
autolock    = false
output      = surface

[dosbox]
machine     = pc98
memsize     = 15
title       = XENON-DBG

[cpu]
core        = normal          ; 필수. dynamic 이면 브레이크포인트/로그가 무력화된다
cputype     = 386
cycles      = fixed 8000

[log]
logfile     = C:\thelife\Xenon-KO\dbg\dosbox.log

[pc98]
pc-98 force ibm keyboard layout = true

[autoexec]
# HDI 는 -t hdd. (-t hd 는 실제 드라이브로 오인돼 경고가 뜬다)
# ⚠ out/run/ 은 kotest.py 가 만드는 사본이라 낡을 수 있다.
#   여기서는 dbg/ 로 따로 복사한 것을 쓴다 (run_dbg.ps1 이 매번 갱신).
imgmount c C:\thelife\Xenon-KO\dbg\xenon_dbg.hdi -t hdd
c:
AGS.EXE
